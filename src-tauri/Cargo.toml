[package]
name = "parrot"
version = "0.1.0"
description = "Read a text aloud and see which words came out wrong"
authors = ["Muzaffar Qosimov"]
license = "MIT"
repository = "https://github.com/qwertymuzaffar/parrot"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "parrot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4" }
tauri-plugin-log = "2"
