<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1D2A20" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- the macOS icon grid: an 824 px rounded tile centred on 1024; the mark is drawn on a 100-unit grid inside it -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#F6F3EA" filter="url(#shadow)"/>
  <g transform="translate(100 100) scale(8.24)">
    <!-- the head: sound bars, tallest at the crown -->
    <g stroke="#1E9E5A" stroke-width="6" stroke-linecap="round">
      <path d="M21 50v8"/>
      <path d="M29.5 40v26"/>
      <path d="M38 32v38"/>
      <path d="M46.5 28v42"/>
      <path d="M55 28v38"/>
      <path d="M63.5 33v26"/>
    </g>
    <!-- the hooked beak: upper, then lower -->
    <path d="M68 33c11-1 17 7 14.5 19.5-2.8-5.2-7.4-7.6-13.6-6.8z" fill="#FFB020"/>
    <path d="M68.6 46.2c4.6-.4 8.4 1.1 10.6 4.6-3.6 2.8-8 2.4-10.9-.6z" fill="#E88A0C"/>
    <!-- the eye -->
    <circle cx="55" cy="39" r="4.4" fill="#14201A"/>
    <circle cx="56.5" cy="37.5" r="1.4" fill="#FFFFFF"/>
  </g>
</svg>
