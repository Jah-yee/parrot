# Builds the installers for macOS (Apple Silicon), Windows and Linux when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0), and attaches them to a draft release to review and publish.
# The download page (docs/) picks the files up from the latest published release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # ONNX Runtime's ready-made Linux build needs glibc 2.38+ (Ubuntu 24.04 and other 2024+ systems)
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Parrot v__VERSION__
          releaseBody: See the assets below for macOS, Windows and Linux, or the download page at https://qwertymuzaffar.github.io/parrot/.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
